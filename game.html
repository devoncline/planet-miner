<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Miner - Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <h1>Mine the Planet</h1>

    <button id="settingsButton" aria-label="Open settings">
        <i class="fa-solid fa-gear"></i>
    </button>

    <div id="settingsPanel">
        <p>Audio Settings</p>

        <label>
            <input type="checkbox" id="musicToggle" checked>
            Music
        </label>

        <label>
            <input type="checkbox" id="sfxToggle" checked>
            Sound Effects
        </label>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="collection.html">View Collection</a></li>
        </ul>
    </nav>

    <div id="gameArea">
        <img id="planet" src="assets/items/space_rock.png" alt="Planet">
        <img id="asteroid" src="assets/items/meteor.png" alt="Asteroid">
        <div id="impactFlash">
            <div class="spark spark1"></div>
            <div class="spark spark2"></div>
            <div class="spark spark3"></div>
            <div class="spark spark4"></div>
        </div>
        <p id="miningResult"></p>
        <p id="incomingAlert">INCOMING ASTEROID!</p>
    </div>

    <button id="mineButton">Mine Impact Site</button>
    <button id="continueButton">Resume Scan</button>

    <script src="js/game.js"></script>
</body>

</html>
